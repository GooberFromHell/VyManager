instructions: |
  Create a donut chart widget showing disk partition usage.

  ## Component: PrometheusDiskDonut.tsx

  - Subscribe to: `disk_used_percent` or `disk_used` + `disk_total` from Prometheus
  - Use Recharts PieChart with innerRadius (donut style)
  - One segment per partition, colored by usage level:
    - Green: 0-60%
    - Yellow: 60-80%
    - Red: 80-100%
  - Center of donut: total disk usage percentage
  - Legend below showing partition mount points with used/total
  - Compact layout for span=3, height=1

  Config: specific partitions to include/exclude, refresh interval

  ## Register

  ```typescript
  registerWidget({
    type: "prometheus-disk-donut",
    name: "Disk Usage",
    description: "Donut chart showing disk partition usage",
    icon: HardDrive,
    component: PrometheusDiskDonut,
    defaultConfig: { refreshInterval: 30000 },
    defaultSpan: 4,
    defaultHeight: 1,
    dataSource: "prometheus",
  });
  ```

