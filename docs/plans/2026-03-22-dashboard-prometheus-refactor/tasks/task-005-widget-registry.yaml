instructions: |
  ## 1. Create `widget-registry.ts`

  Define the widget registration system that replaces the hardcoded `renderCard()` switch and `AVAILABLE_CARDS` array.

  ```typescript
  import { LucideIcon } from "lucide-react";
  import { ComponentType } from "react";

  export interface WidgetProps {
    id: string;
    config: Record<string, unknown>;
    span: number;
    height: number;
    editMode: boolean;
    onConfigChange?: (config: Record<string, unknown>) => void;
  }

  export interface WidgetConfigPanelProps {
    config: Record<string, unknown>;
    onChange: (config: Record<string, unknown>) => void;
  }

  export interface WidgetRegistration {
    type: string;
    name: string;
    description: string;
    icon: LucideIcon;
    component: ComponentType<WidgetProps>;
    configPanel?: ComponentType<WidgetConfigPanelProps>;
    defaultConfig: Record<string, unknown>;
    defaultSpan: number;      // 1-12 (12-column grid)
    defaultHeight: number;    // 1-3 row units
    dataSource: "sse" | "prometheus" | "hybrid";
    requiredPermission?: string; // FeatureGroup name
  }

  const registry = new Map<string, WidgetRegistration>();

  export function registerWidget(reg: WidgetRegistration) {
    registry.set(reg.type, reg);
  }

  export function getWidget(type: string): WidgetRegistration | undefined {
    return registry.get(type);
  }

  export function getAllWidgets(): WidgetRegistration[] {
    return Array.from(registry.values());
  }

  export function getWidgetsByDataSource(source: "sse" | "prometheus" | "hybrid"): WidgetRegistration[] {
    return getAllWidgets().filter(w => w.dataSource === source);
  }
  ```

  Then register the 4 existing widgets (import their components lazily):
  - "interface-statistics" → InterfaceStatisticsCard, dataSource: "sse", defaultSpan: 12, defaultHeight: 2
  - "system-info" → SystemInfoCard, dataSource: "sse", defaultSpan: 4, defaultHeight: 2
  - "network-speed" → NetworkSpeedCard, dataSource: "sse", defaultSpan: 8, defaultHeight: 2
  - "wireguard-peers" → WireGuardPeersCard, dataSource: "sse", defaultSpan: 6, defaultHeight: 2, requiredPermission: "WIREGUARD"

  Use appropriate Lucide icons (Activity, Cpu, Gauge, Shield).

  ## 2. Create `WidgetShell.tsx`

  Shared wrapper for all dashboard widgets providing consistent header and edit-mode controls.

  Props: `{ title, icon, children, editMode, span, height, onSpanChange, onHeightChange, onRemove, onConfigure }`

  Renders:
  - Card with consistent header (icon + title + right-side controls)
  - In edit mode: span selector (dropdown: 3/4/6/8/12), height selector (1/2/3), configure gear button, remove button
  - In view mode: just the card content
  - Loading and error states as optional props
  - Uses shadcn Card, DropdownMenu, Button components
  - Consistent dark-theme styling

