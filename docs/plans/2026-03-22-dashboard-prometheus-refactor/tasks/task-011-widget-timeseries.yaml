instructions: |
  Create a configurable multi-line time-series chart widget — the "power user" widget.

  ## Component: PrometheusTimeSeries.tsx

  - Subscribe to configured Prometheus metric families
  - Use Recharts LineChart with multiple Line children (one per series)
  - Rolling time window (configurable: 1m, 5m, 15m, 30m)
  - Features:
    - Auto-scaling Y-axis
    - Tooltip with all series values at hover point
    - Legend showing series names with color dots
    - Gradient fill under lines (subtle, like NetworkSpeedCard)
    - Responsive container
    - Up to 8 concurrent series with distinct colors
  - Dark theme: axis/grid in muted colors, white text, colored lines

  ## Config Panel

  Must include a config panel component for the WidgetConfigDrawer:
  - Metric family selector (dropdown/multi-select from available families)
  - Label filter (optional: e.g., filter by `interface="eth0"`)
  - Time window selector (1m/5m/15m/30m)
  - Y-axis unit selector (raw, bytes, percent, bps, packets)
  - Refresh interval (5s/10s/30s)

  Use a simple multi-step form:
  1. Select metric families
  2. Configure display options

  ## Register in widget-registry.ts

  ```typescript
  registerWidget({
    type: "prometheus-timeseries",
    name: "Time Series Chart",
    description: "Configurable multi-line chart for any Prometheus metric",
    icon: TrendingUp,
    component: PrometheusTimeSeries,
    configPanel: PrometheusTimeSeriesConfig,
    defaultConfig: { families: [], timeWindow: 300000, unit: "raw", refreshInterval: 5000 },
    defaultSpan: 6,
    defaultHeight: 2,
    dataSource: "prometheus",
  });
  ```

