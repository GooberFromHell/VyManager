instructions: |
  ## 1. Create `layout-migration.ts`

  Utility to convert old 3-column layouts to 12-column format.

  ```typescript
  export function migrateLayout(layout: DashboardLayout): DashboardLayout {
    // Check if already migrated (any card has span > 3 or column > 2)
    const needsMigration = layout.cards.every(c => c.span <= 3 && c.column <= 2);
    if (!needsMigration) return layout;

    return {
      cards: layout.cards.map(card => ({
        ...card,
        column: card.column * 4,     // 0→0, 1→4, 2→8
        span: card.span * 4,         // 1→4, 2→8, 3→12
        height: card.height ?? 2,    // default to standard height
      }))
    };
  }
  ```

  ## 2. Refactor `page.tsx`

  Major changes:
  - Replace `grid-cols-3` with `grid-cols-12`
  - Use widget registry's `getWidget(card.type)` instead of `renderCard()` switch statement
  - Update `getGridClasses()` to use 12-column spans (col-span-3, col-span-4, col-span-6, col-span-8, col-span-12)
  - Update `getGridStyle()` for height units (height = rowUnits * 260px + gap)
  - Apply layout migration on `loadDashboard()` response
  - Update DnD drop zones: 4 drop zones (columns 0, 3, 6, 9) instead of 3
  - Update `handleDragEnd()` for 12-column grid math
  - Update card placement validation for 12-column spans
  - Import from widget registry instead of individual card imports
  - Add `height` to the DashboardCard interface (extend existing)

  Keep the overall structure: DndContext > SortableContext > grid > SortableCards.
  Keep the existing save/load/edit mode pattern unchanged.

  ## 3. Update `AddCardModal.tsx`

  - Import `getAllWidgets()` from widget registry instead of hardcoded card list
  - Group widgets by `dataSource` ("SSE Data" vs "Prometheus Data")
  - Show "Requires Prometheus" badge on prometheus widgets
  - Accept `prometheusAvailable` prop to disable prometheus widgets when unavailable
  - Each widget entry shows: icon, name, description, data source badge

