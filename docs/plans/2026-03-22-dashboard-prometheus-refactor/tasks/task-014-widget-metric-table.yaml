instructions: |
  Create a sortable metric table with monospace values and threshold coloring.

  ## Component: PrometheusMetricTable.tsx

  - Subscribe to configured Prometheus metric families
  - Render a table with columns:
    - Metric name (with label values if applicable)
    - Current value (monospace, right-aligned)
    - Optional: mini sparkline cell showing trend
  - Sortable by name or value (click column header)
  - Threshold coloring: configurable breakpoints turn value cell green/yellow/red
  - Monospace font for all numeric values
  - Compact rows for density
  - Scrollable within card height if many metrics
  - Alternating row shading (subtle, dark theme)

  Config panel:
  - Metric family selector
  - Threshold configuration (warning level, critical level)
  - Columns to show
  - Refresh interval

  ## Register

  ```typescript
  registerWidget({
    type: "prometheus-metric-table",
    name: "Metric Table",
    description: "Tabular display of metrics with threshold coloring",
    icon: Table,
    component: PrometheusMetricTable,
    configPanel: PrometheusMetricTableConfig,
    defaultConfig: { families: [], thresholds: { warning: 70, critical: 90 }, refreshInterval: 10000 },
    defaultSpan: 6,
    defaultHeight: 2,
    dataSource: "prometheus",
  });
  ```

