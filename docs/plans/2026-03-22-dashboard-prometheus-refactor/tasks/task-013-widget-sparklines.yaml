instructions: |
  Create a grid of small sparkline charts, one per interface, showing throughput over time.

  ## Component: PrometheusInterfaceSparklines.tsx

  - Subscribe to: `net_bytes_recv`, `net_bytes_sent` (or equivalent Telegraf interface metrics)
  - Calculate rate (bytes/sec) from counter deltas
  - Render a CSS grid of small cards, each containing:
    - Interface name (monospace, small)
    - Tiny Recharts AreaChart (~120px wide, ~40px tall) showing RX/TX rates
    - Current speed value below the sparkline
  - Grid auto-fills based on container width (repeat(auto-fill, minmax(160px, 1fr)))
  - Sort interfaces by name or by traffic volume
  - Highlight interfaces with traffic above a threshold
  - Empty interfaces shown dimmed

  Config panel: interfaces to include/exclude, time window, sort order

  ## Register

  ```typescript
  registerWidget({
    type: "prometheus-interface-sparklines",
    name: "Interface Sparklines",
    description: "Grid of mini charts showing per-interface throughput",
    icon: Activity,
    component: PrometheusInterfaceSparklines,
    defaultConfig: { timeWindow: 300000, sortBy: "name", refreshInterval: 5000 },
    defaultSpan: 6,
    defaultHeight: 2,
    dataSource: "prometheus",
  });
  ```

