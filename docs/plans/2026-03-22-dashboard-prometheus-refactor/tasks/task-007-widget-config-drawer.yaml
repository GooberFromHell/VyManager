instructions: |
  Create a Sheet-based (right-side drawer) widget configuration panel.

  Props:
  ```typescript
  interface WidgetConfigDrawerProps {
    open: boolean;
    onOpenChange: (open: boolean) => void;
    widgetType: string;
    config: Record<string, unknown>;
    onConfigChange: (config: Record<string, unknown>) => void;
    span: number;
    height: number;
    onSpanChange: (span: number) => void;
    onHeightChange: (height: number) => void;
  }
  ```

  Implementation:
  - Uses shadcn Sheet component (side="right", width ~400px)
  - Header: widget name + icon (from registry)
  - Common config section: span selector (dropdown: 3/4/6/8/12), height selector (1/2/3), refresh interval
  - Widget-specific section: renders the `configPanel` from the widget registry if it exists
  - Changes apply immediately (no separate save button — changes are reflected in the card)
  - Close button in header

  Style: dark theme, consistent with existing modals. Use Fieldset for form sections.

