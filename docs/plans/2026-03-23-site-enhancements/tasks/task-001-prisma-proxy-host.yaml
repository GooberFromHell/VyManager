  1. Read `frontend/prisma/schema.prisma` and find the `Site` model
  2. Add a nullable field `proxyHostId String?` to the Site model
  3. Add a relation: `proxyHost Instance? @relation("SiteProxyHost", fields: [proxyHostId], references: [id], onDelete: SetNull)`
  4. On the `Instance` model, add the back-relation: `proxiedSites Site[] @relation("SiteProxyHost")`
  5. Run: `cd frontend && npx prisma migrate dev --name add_site_proxy_host`
  6. Run: `cd frontend && npx prisma generate`
  7. Verify the migration was created successfully
