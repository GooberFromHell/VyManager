instructions: |
  1. Read `frontend/src/lib/api/session.ts` fully
  2. Find the existing interfaces and SessionService class

  Add the following:

  **New interface** (near other interfaces):
  ```typescript
  export interface InstanceStatus {
    instance_id: string;
    status: "online" | "offline" | "error";
    latency_ms?: number;
    error?: string;
  }

  export interface SiteStatusResponse {
    site_id: string;
    instances: InstanceStatus[];
  }
  ```

  **New method in SessionService class:**
  ```typescript
  async checkSiteStatus(siteId: string): Promise<InstanceStatus[]> {
    const response = await this.request<SiteStatusResponse>(
      `/vyos/session/sites/${siteId}/instances/status`
    );
    return response.instances;
  }
  ```

  Make sure to use the same `this.request` pattern that the other methods in the class use.
