instructions: |
  Create three modals for container registry management. Registries are the simplest entity — URL, auth, disable, insecure.

  ## 1. CreateContainerRegistryModal.tsx

  Props:
  ```typescript
  interface CreateContainerRegistryModalProps {
    open: boolean;
    onOpenChange: (open: boolean) => void;
    onSuccess: () => void;
    capabilities: ContainerCapabilities | null;
    existingUrls?: string[];
  }
  ```

  Form fields:
  - Registry URL (required, text input, validate no duplicates, placeholder "docker.io")
  - Username (optional, text)
  - Password (optional, text input type="password")
  - Insecure (Checkbox — "Allow insecure connections (no TLS verification)")
  - Disable (Checkbox)

  Submit:
  ```typescript
  const operations = [];
  if (username && password) {
    operations.push({ op: "set_registry_auth", value: `${username},${password}` });
  }
  if (insecure) operations.push({ op: "set_registry_insecure" });
  if (disabled) operations.push({ op: "set_registry_disable" });
  await containerService.createRegistry(registryUrl, operations);
  await containerService.refreshConfig();
  ```

  Dialog size: max-w-md

  ## 2. EditContainerRegistryModal.tsx

  Props include `registry: ContainerRegistry`.
  - Initialize from registry prop
  - Note: password may not be returned from API (security), show placeholder if empty
  - Build diff-based operations

  ## 3. DeleteContainerRegistryModal.tsx

  Simple confirmation:
  - Props: `open`, `onOpenChange`, `onSuccess`, `registryUrl: string`
  - Show registry URL in destructive warning
  - On confirm: `containerService.deleteRegistry(registryUrl)`

