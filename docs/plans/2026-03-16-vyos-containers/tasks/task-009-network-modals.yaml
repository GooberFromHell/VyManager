instructions: |
  Create three modals for container network management. Networks are simpler than containers — just name, prefixes, description, MTU, VRF.

  ## 1. CreateContainerNetworkModal.tsx

  Props:
  ```typescript
  interface CreateContainerNetworkModalProps {
    open: boolean;
    onOpenChange: (open: boolean) => void;
    onSuccess: () => void;
    capabilities: ContainerCapabilities | null;
    existingNames?: string[];
  }
  ```

  Form fields:
  - Network Name (required, text input, validate no duplicates)
  - Prefixes (dynamic list of text inputs, at least one required, validate IPv4/IPv6 CIDR format)
  - Description (optional, text)
  - MTU (optional, number input)
  - VRF (optional, text)
  - No Name Server (Checkbox, v1.5 only — check capabilities.has_network_no_name_server)

  Submit: build operations array:
  ```typescript
  const operations = [];
  for (const prefix of prefixes) {
    operations.push({ op: "set_network_prefix", value: prefix });
  }
  if (description) operations.push({ op: "set_network_description", value: description });
  if (mtu) operations.push({ op: "set_network_mtu", value: String(mtu) });
  if (vrf) operations.push({ op: "set_network_vrf", value: vrf });
  if (noNameServer && capabilities?.has_network_no_name_server) {
    operations.push({ op: "set_network_no_name_server" });
  }
  await containerService.createNetwork(networkName, operations);
  await containerService.refreshConfig();
  ```

  Dialog size: max-w-md (simpler form)

  ## 2. EditContainerNetworkModal.tsx

  Props include `network: ContainerNetwork`.
  - Initialize form from network prop
  - Diff old vs new for operations:
    - Compare prefix sets (add new, delete removed)
    - Compare scalar fields

  ## 3. DeleteContainerNetworkModal.tsx

  Simple confirmation:
  - Props: `open`, `onOpenChange`, `onSuccess`, `networkName: string`
  - Warning: "Containers using this network will lose connectivity"
  - On confirm: `containerService.deleteNetwork(networkName)`
  - Same destructive pattern as other delete modals

