instructions: |
  Run validation checks to verify the entire container feature compiles and passes linting.

  ## Steps:

  1. Run TypeScript type checking:
     ```bash
     cd frontend && npx tsc --noEmit
     ```
     - Must pass with zero errors related to container files
     - If there are pre-existing errors unrelated to containers, note them but don't fix

  2. Run ESLint:
     ```bash
     cd frontend && npm run lint
     ```
     - Must pass with zero errors in container files

  3. Verify all expected files exist:
     - backend/vyos_mappers/container/container.py
     - backend/vyos_mappers/container/container_versions/__init__.py
     - backend/vyos_mappers/container/container_versions/v1_4.py
     - backend/vyos_mappers/container/container_versions/v1_5.py
     - backend/vyos_builders/container/container.py
     - backend/routers/container/container.py
     - frontend/src/lib/api/types/container.ts
     - frontend/src/lib/api/container.ts
     - frontend/src/app/(default)/(app)/containers/page.tsx
     - frontend/src/components/containers/CreateContainerModal.tsx
     - frontend/src/components/containers/EditContainerModal.tsx
     - frontend/src/components/containers/DeleteContainerModal.tsx
     - frontend/src/components/containers/CreateContainerNetworkModal.tsx
     - frontend/src/components/containers/EditContainerNetworkModal.tsx
     - frontend/src/components/containers/DeleteContainerNetworkModal.tsx
     - frontend/src/components/containers/CreateContainerRegistryModal.tsx
     - frontend/src/components/containers/EditContainerRegistryModal.tsx
     - frontend/src/components/containers/DeleteContainerRegistryModal.tsx

  4. Verify registrations:
     - Grep for "container" registration in backend/vyos_mappers/__init__.py
     - Grep for "ContainerBatchBuilder" in backend/vyos_builders/__init__.py
     - Grep for "container_router" in backend/app.py
     - Grep for "CONTAINER" in backend/rbac_permissions.py
     - Grep for "CONTAINER" in frontend/src/lib/api/user-management.ts
     - Grep for "/containers" in frontend/src/components/layout/Sidebar.tsx

  5. If any errors are found, fix them directly. Common issues:
     - Missing imports
     - Type mismatches between backend response and frontend types
     - Incorrect component prop types

