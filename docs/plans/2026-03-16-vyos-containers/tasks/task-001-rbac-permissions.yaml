instructions: |
  Add CONTAINER permission to both backend and frontend FeatureGroup enums and all role permission maps.

  ## Backend: backend/rbac_permissions.py

  1. Add to FeatureGroup enum (after CONNTRACK_SYNC, before SYSTEM):
     ```python
     CONTAINER = "CONTAINER"
     ```

  2. Add to BUILT_IN_PERMISSIONS for ADMIN role (after CONNTRACK_SYNC line):
     ```python
     FeatureGroup.CONTAINER: PermissionLevel.WRITE,
     ```

  3. Add to BUILT_IN_PERMISSIONS for OPERATOR role (after CONNTRACK_SYNC line):
     ```python
     FeatureGroup.CONTAINER: PermissionLevel.WRITE,
     ```

  4. Add to BUILT_IN_PERMISSIONS for VIEWER role (after CONNTRACK_SYNC line):
     ```python
     FeatureGroup.CONTAINER: PermissionLevel.READ,
     ```

  5. Add FeatureGroup.CONTAINER to the `all_features` list in get_user_permissions() (the site ADMIN block, after CONNTRACK_SYNC):
     ```python
     FeatureGroup.CONTAINER,
     ```

  6. Add FeatureGroup.CONTAINER to the `vyos_features` list in get_user_permissions() (the instance ADMIN block, after CONNTRACK_SYNC):
     ```python
     FeatureGroup.CONTAINER,
     ```

  ## Frontend: frontend/src/lib/api/user-management.ts

  1. Add to the FeatureGroup enum (after CONNTRACK_SYNC, before SYSTEM):
     ```typescript
     CONTAINER = "CONTAINER",
     ```

