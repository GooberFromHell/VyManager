instructions: |
  Add FeatureGroup entries for the 4 Phase 3 services. This is a cross-cutting prerequisite — all
  subsequent tasks depend on these entries existing.

  ## Step 1: Backend FeatureGroup enum (backend/rbac_permissions.py)

  Read the file first. Find the `FeatureGroup(str, Enum)` class and add these 4 entries following
  the existing naming convention (look at how DNS_FORWARDING, NTP, SSH, DHCP_RELAY, etc. are defined):

  ```python
  ROUTER_ADVERT = "ROUTER_ADVERT"
  TFTP_SERVER = "TFTP_SERVER"
  BROADCAST_RELAY = "BROADCAST_RELAY"
  CONNTRACK_SYNC = "CONNTRACK_SYNC"
  ```

  Then find ALL places where existing service FeatureGroups are referenced and add entries for the 4 new ones:

  1. `BUILT_IN_PERMISSIONS[BuiltInRole.ADMIN]` — add all 4 with `PermissionLevel.WRITE`
  2. `BUILT_IN_PERMISSIONS[BuiltInRole.OPERATOR]` — add all 4 with `PermissionLevel.WRITE`
  3. `BUILT_IN_PERMISSIONS[BuiltInRole.VIEWER]` — add all 4 with `PermissionLevel.READ`
  4. The `all_features` list in `get_user_permissions()` for site ADMIN — add all 4
  5. The `vyos_features` list in `get_user_permissions()` for instance ADMIN — add all 4

  Follow the EXACT pattern of existing services (DNS_FORWARDING, NTP, SSH, etc.).

  ## Step 2: Frontend FeatureGroup enum (frontend/src/lib/api/user-management.ts)

  Read the file. Find the TypeScript `FeatureGroup` enum and add matching entries:

  ```typescript
  ROUTER_ADVERT = "ROUTER_ADVERT",
  TFTP_SERVER = "TFTP_SERVER",
  BROADCAST_RELAY = "BROADCAST_RELAY",
  CONNTRACK_SYNC = "CONNTRACK_SYNC",
  ```

  Follow the exact pattern of existing entries.

