instructions: |
  Create Broadcast Relay backend. This is a collection-based service (relay instances by numeric ID).
  Use NTP as the primary reference, DNS Forwarding router for collection config parsing patterns.

  ## VyOS CLI Command Tree
  ```
  set service broadcast-relay
    id <1-99>                  # relay instance number (collection key)
      description <text>
      interface <name>         # multi-value
      address <ip>             # destination broadcast address
      port <1-65535>           # UDP port to relay
      disable                  # flag
  ```

  Config path: `full_config["service"]["broadcast-relay"]["id"]` → dict keyed by relay ID

  No significant v1.4 vs v1.5 differences — stable across versions.

  ## Step 1: Mapper (backend/vyos_mappers/broadcast_relay/broadcast_relay.py)

  Create `BroadcastRelayMapper(BaseFeatureMapper)`:
  - `get_id(relay_id)` → `["service", "broadcast-relay", "id", relay_id]`
  - `get_description(relay_id, desc)` → `["service", "broadcast-relay", "id", relay_id, "description", desc]`
  - `get_interface(relay_id, iface)` → `["service", "broadcast-relay", "id", relay_id, "interface", iface]`
  - `get_address(relay_id, addr)` → `["service", "broadcast-relay", "id", relay_id, "address", addr]`
  - `get_port(relay_id, port)` → `["service", "broadcast-relay", "id", relay_id, "port", port]`
  - `get_disable(relay_id)` → `["service", "broadcast-relay", "id", relay_id, "disable"]`
  - Corresponding `_path` methods for delete operations

  Version mappers: Both v1.4 and v1.5 are identical (no version-specific features).
  Still create the full _versions/ structure for consistency.

  ## Step 2: Builder (backend/vyos_builders/broadcast_relay/broadcast_relay.py)

  Create `BroadcastRelayBatchBuilder`:
  - mapper_key = "broadcast_relay"
  - Feature methods (relay_id is first param for most):
    - set_id(relay_id), delete_id(relay_id)
    - set_description(relay_id, desc), delete_description(relay_id)
    - set_interface(relay_id, iface), delete_interface(relay_id, iface)
    - set_address(relay_id, addr), delete_address(relay_id)
    - set_port(relay_id, port), delete_port(relay_id)
    - set_disable(relay_id), delete_disable(relay_id)
  - get_capabilities(): return version info, no special feature flags

  ## Step 3: Router (backend/routers/broadcast_relay/broadcast_relay.py)

  - `router = APIRouter(prefix="/vyos/broadcast-relay", tags=["broadcast-relay"])`
  - Pydantic models:
    - `BroadcastRelayInstance`: id (str), description (Optional[str]), interfaces (List[str]),
      address (Optional[str]), port (Optional[str]), disabled (bool)
    - `BroadcastRelayConfigResponse`: relays (List[BroadcastRelayInstance])
    - `BroadcastRelayBatchOperation`: op (str), value (Optional[str])
    - `BroadcastRelayBatchRequest`: item_name (Optional[str]), operations (List[...])
  - GET /config: Parse full_config["service"]["broadcast-relay"]["id"] dict.
    Each key is a relay ID, value is a dict with description, interface (may be str or list),
    address, port, disable. Handle gracefully if "broadcast-relay" or "id" key doesn't exist.
  - GET /capabilities, POST /batch: standard patterns
  - POST /batch MUST call ensure_snapshot_before_change()
  - Use FeatureGroup.BROADCAST_RELAY for permissions

