instructions: |
  Add FILE_BROWSER as a new FeatureGroup in both backend and frontend.

  ## Backend: backend/rbac_permissions.py

  1. Add `FILE_BROWSER = "FILE_BROWSER"` to the `FeatureGroup` enum.
     Place it in the Services section, after `CONTAINER = "CONTAINER"` (around line 104).

  2. Add `FeatureGroup.FILE_BROWSER: PermissionLevel.WRITE` to the ADMIN built-in permissions dict (around line 196, after CONTAINER).

  3. Add `FeatureGroup.FILE_BROWSER: PermissionLevel.WRITE` to the OPERATOR built-in permissions dict (around line 267, after CONTAINER).

  4. Add `FeatureGroup.FILE_BROWSER: PermissionLevel.NONE` to the VIEWER built-in permissions dict (after CONTAINER around line 339). Viewers should NOT have file browser access.

  5. Add `FeatureGroup.FILE_BROWSER` to the `all_features` list in the site-admin section of `get_user_permissions()` (around line 452, after CONTAINER).

  6. Add `FeatureGroup.FILE_BROWSER` to the `vyos_features` list in the instance-admin section of `get_user_permissions()` (around line 547, after CONTAINER).

  ## Frontend: frontend/src/lib/api/user-management.ts

  7. Add `FILE_BROWSER = "FILE_BROWSER"` to the `FeatureGroup` enum.
     Place it in the Services section, after `CONTAINER = "CONTAINER"` (around line 185).

acceptance_criteria:
