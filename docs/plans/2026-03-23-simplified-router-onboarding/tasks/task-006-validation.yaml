    - frontend/

instructions: |
  1. Run: cd frontend && npx tsc --noEmit
  2. If there are type errors, fix them in the relevant files
  3. Run: cd frontend && npm run lint
  4. If there are lint errors, fix them
  5. Repeat until both pass clean

