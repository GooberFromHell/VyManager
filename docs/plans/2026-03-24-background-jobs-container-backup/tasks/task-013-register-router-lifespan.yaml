id: task-013-register-router-lifespan
title: "Register jobs router in app.py and add lifespan tasks for job management"
archetype: registration
phase: 4
depends_on: [task-004, task-006]
parallel_with: [task-014]
agent: general-purpose
status: not_started

files:
  create: []
  modify:
    - "backend/app.py"

context_files:
  - ".derpo/architecture.md"
  - "backend/app.py"
  - "backend/routers/site_tools/jobs.py"
  - "backend/routers/site_tools/backup.py"
  - "backend/background_jobs.py"
  - "docs/plans/2026-03-24-background-jobs-container-backup/decision-document.md"

instructions: |
  Register the new jobs router in app.py, add a startup task to prune old jobs, and
  add shutdown logic to cancel running backup job tasks.

  ## Step 1: Read app.py
  Read `backend/app.py` fully to understand the current structure:
  - Import section at top
  - Lifespan context manager
  - Middleware configuration
  - Router includes
  - Root endpoint

  ## Step 2: Add import for the jobs router
  In the import section, near the other site_tools imports, add:
  ```python
  from routers.site_tools import jobs as site_jobs_router
  ```

  Also add the import for backup's running tasks set:
  ```python
  from routers.site_tools.backup import _running_job_tasks
  ```

  And import the background_jobs module:
  ```python
  import background_jobs
  ```

  ## Step 3: Register the router
  In the router includes section, add the jobs router near the existing site_backup_router:
  ```python
  app.include_router(site_jobs_router.router)
  ```

  Place it right after the `app.include_router(site_backup_router.router)` line.

  ## Step 4: Add startup task in lifespan
  In the `lifespan` function, after the cleanup_task creation and before the "API Ready" message,
  add the job pruning startup task:

  ```python
  # Prune stale background jobs (mark orphaned running jobs as failed)
  if db_pool:
      try:
          await background_jobs.prune_old_jobs(db_pool)
          print("  ✓ Background jobs pruned (stale jobs marked as failed)")
      except Exception as e:
          print(f"  ⚠ Failed to prune background jobs: {e}")
  ```

  This runs once at startup (not as a recurring task). It marks any jobs stuck in
  "running" or "queued" state (from a previous crash) as "failed".

  ## Step 5: Add shutdown logic for running backup tasks
  In the shutdown section of the `lifespan` function, after stopping the cleanup_task
  and before closing the database pool, add:

  ```python
  # Cancel any running backup job tasks
  if _running_job_tasks:
      print(f"  ⏳ Cancelling {len(_running_job_tasks)} running backup job(s)...")
      for task in list(_running_job_tasks):
          task.cancel()
      # Wait for all tasks to finish (with a timeout)
      try:
          await asyncio.wait(list(_running_job_tasks), timeout=10.0)
      except Exception:
          pass
      print("  ✓ Backup job tasks cancelled")
  ```

  This ensures that on graceful shutdown:
  1. All running backup coroutines are cancelled.
  2. We wait up to 10 seconds for them to finish their cleanup.
  3. The database pool is then closed (after tasks have finished).

  ## Step 6: Verify ordering
  The shutdown sequence must be:
  1. Cancel cleanup_task (session cleanup)
  2. Cancel _running_job_tasks (backup jobs)
  3. Close db_pool

  This ordering is critical because backup jobs need the db_pool to update their status
  to "cancelled" during cleanup.

  ## Important notes
  - The `_running_job_tasks` set is defined in `backend/routers/site_tools/backup.py` and
    populated by `asyncio.create_task` calls in the refactored backup endpoint (task-006).
  - The `prune_old_jobs` call at startup is a one-shot operation, not a recurring task.
  - Do not add a recurring prune task — the 24-hour TTL is long enough that startup-only
    pruning is sufficient.

acceptance_criteria:
  - "site_jobs_router is imported from routers.site_tools.jobs"
  - "app.include_router(site_jobs_router.router) is added to the router includes"
  - "background_jobs.prune_old_jobs is called during startup in the lifespan function"
  - "Startup prune prints a success/failure message"
  - "_running_job_tasks is imported from routers.site_tools.backup"
  - "Running backup tasks are cancelled during shutdown before db_pool is closed"
  - "Shutdown waits up to 10 seconds for backup tasks to finish"
  - "Shutdown ordering is: cleanup_task -> backup tasks -> db_pool close"

