  - "Step 2 shows a summary of what will be restored (config, volumes, image, runtime)"
  - "Step 3 executes the restore and shows per-step results"
  - "Loading spinner is shown during restore execution"
  - "Per-step results use color-coded check/X icons"
  - "Back/Next navigation between steps 1 and 2"
  - "Close button on step 3 after completion"
  - "BackupDetailModal has a 'Restore Container' button per container row"
  - "Wizard resets to step 1 when reopened"
  - "Error state is handled and displayed inline"

