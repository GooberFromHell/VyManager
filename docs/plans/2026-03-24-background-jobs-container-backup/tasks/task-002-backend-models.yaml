  - "ContainerImageManifest model exists with fields: container_name, image_ref, image_digest, image_archive_path, error"
  - "ContainerRuntimeStatus model exists with fields: container_name, running, exit_code, uptime_seconds"
  - "ContainerFullBackup model exists with fields: container_name, config_commands, volumes, image_manifest, runtime_status"
  - "InstanceBackupResult has new field: containers (Optional[List[ContainerFullBackup]])"
  - "InstanceBackupResult has new field: container_backup_errors (List[str] with default [])"
  - "All new models are defined above InstanceBackupResult in the file"
  - "No new imports are needed (Optional, List, BaseModel already imported)"

