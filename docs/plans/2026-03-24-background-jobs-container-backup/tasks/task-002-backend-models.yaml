instructions: |
  Add container backup Pydantic models to backup.py and extend the existing InstanceBackupResult
  model with container-related fields.

  ## Step 1: Read the current backup.py
  Read `backend/routers/site_tools/backup.py` to understand the existing models and structure.

  ## Step 2: Add new Pydantic models
  Add the following models ABOVE the existing `InstanceBackupResult` class, in a new subsection
  with a comment header "Container Backup Models":

  ```python
  # ============================================================================
  # Container Backup Models
  # ============================================================================

  class VolumeBackupData(BaseModel):
      """Backup data for a single container volume."""
      volume_name: str
      source_path: str              # Path on the VyOS host filesystem
      size_bytes: Optional[int] = None
      data_base64: Optional[str] = None  # base64-encoded tar.gz of the volume directory
      error: Optional[str] = None

  class ContainerImageManifest(BaseModel):
      """Image metadata for a container at backup time."""
      container_name: str
      image_ref: str                # e.g. "ghcr.io/foo/bar:latest"
      image_digest: Optional[str] = None  # sha256:... pinned digest
      image_archive_path: Optional[str] = None  # Future: path to exported .tar for air-gap
      error: Optional[str] = None

  class ContainerRuntimeStatus(BaseModel):
      """Runtime state of a container at backup time."""
      container_name: str
      running: bool
      exit_code: Optional[int] = None
      uptime_seconds: Optional[int] = None

  class ContainerFullBackup(BaseModel):
      """Complete backup state for a single container — enough to redeploy."""
      container_name: str
      config_commands: str          # The VyOS set commands for this container
      volumes: List[VolumeBackupData] = []
      image_manifest: ContainerImageManifest
      runtime_status: Optional[ContainerRuntimeStatus] = None
  ```

  ## Step 3: Extend InstanceBackupResult
  Add two new fields to the existing `InstanceBackupResult` class:

  ```python
  containers: Optional[List[ContainerFullBackup]] = None
  container_backup_errors: List[str] = []
  ```

  These fields should be added after the existing `backed_up_at` field. The `containers` field
  is Optional (None when no containers exist or SSH was not available). The
  `container_backup_errors` field defaults to an empty list and collects per-container
  error messages for partial-success scenarios.

  ## Step 4: Verify
  - All models use `BaseModel` from pydantic (already imported).
  - `Optional` and `List` are already imported from `typing` in the file.
  - No circular imports introduced.
  - The `ContainerFullBackup` model includes `container_name` as a top-level field for
    easy identification when iterating the list.

acceptance_criteria:
