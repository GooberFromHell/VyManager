  - "Status indicators use color-coded icons (green check, red X, yellow warning)"
  - "Container rows are expandable to show raw config commands and volume details"
  - "Volume sizes are displayed in human-readable format (KB/MB/GB)"
  - "Container backup errors/warnings are shown in a yellow warning section"
  - "JobCard.tsx has a 'View Details' button for success/partial jobs"
  - "BackupDetailModal is rendered inside JobCard when detail is toggled"
  - "formatBytes helper correctly formats byte sizes"

