instructions: |
  Create `backend/background_jobs.py` — the core module for background job lifecycle management.
  All job state is persisted in PostgreSQL via asyncpg (not in-memory). An in-memory dict of
  `asyncio.Event` objects is used for cancellation signaling only.

  ## Step 1: Understand the database schema
  The `background_jobs` table (created by task-001) has these columns:
  - id (TEXT PK), triggerId, jobType, instanceId, instanceName, siteId, siteName, userId
  - status (TEXT default 'queued'), progress (INT default 0)
  - createdAt (TIMESTAMP default NOW()), startedAt, finishedAt
  - result (JSONB nullable), log (JSONB default '[]'), error (TEXT nullable)
  - cancelRequested (BOOLEAN default false)

  Note: Prisma uses camelCase column names in the database (e.g., "triggerId", "jobType",
  "instanceId", "cancelRequested"). Use these exact column names in SQL queries.

  ## Step 2: Create the module
  Create `backend/background_jobs.py` with the following structure:

  ```python
  """
  Background Jobs Module

  Manages background job lifecycle (create, read, update, cancel, prune)
  via PostgreSQL. Used by backup and future long-running operations.

  Jobs are persisted in the background_jobs table. In-memory asyncio.Event
  objects provide fast cancellation signaling within the running process.
  """

  import asyncio
  import json
  import logging
  from datetime import datetime, timezone, timedelta
  from typing import Optional, Any
  from uuid import uuid4

  import asyncpg

  logger = logging.getLogger(__name__)

  # In-memory cancellation events: job_id -> asyncio.Event
  # Set when cancel is requested; checked by running coroutines.
  # These are transient — lost on restart. The DB column cancelRequested
  # is the durable equivalent (checked by prune_old_jobs on startup).
  _cancel_events: dict[str, asyncio.Event] = {}
  ```

  ## Step 3: Implement helper functions

  ### create_job
  ```python
  async def create_job(
      pool: asyncpg.Pool,
      *,
      trigger_id: str,
      job_type: str,
      instance_id: str,
      instance_name: str,
      site_id: str,
      site_name: str,
      user_id: str,
  ) -> str:
      """Create a new background job record. Returns the job_id."""
      job_id = str(uuid4())
      now = datetime.now(timezone.utc)
      async with pool.acquire() as conn:
          await conn.execute(
              """
              INSERT INTO background_jobs
                  (id, "triggerId", "jobType", "instanceId", "instanceName",
                   "siteId", "siteName", "userId", status, progress,
                   "createdAt", log, "cancelRequested")
              VALUES ($1, $2, $3, $4, $5, $6, $7, $8, 'queued', 0, $9, '[]'::jsonb, false)
              """,
              job_id, trigger_id, job_type, instance_id, instance_name,
              site_id, site_name, user_id, now,
          )
      # Pre-create the cancel event so it is available immediately
      _cancel_events[job_id] = asyncio.Event()
      return job_id
  ```

  ### get_job
  ```python
  async def get_job(pool: asyncpg.Pool, job_id: str) -> Optional[dict]:
      """Fetch a single job record by ID. Returns None if not found."""
      async with pool.acquire() as conn:
          row = await conn.fetchrow(
              'SELECT * FROM background_jobs WHERE id = $1', job_id
          )
      if row is None:
          return None
      return _row_to_dict(row)
  ```

  ### list_jobs
  ```python
  async def list_jobs(
      pool: asyncpg.Pool,
      *,
      user_id: Optional[str] = None,
      site_id: Optional[str] = None,
      trigger_id: Optional[str] = None,
      is_admin: bool = False,
  ) -> list[dict]:
      """
      List jobs with optional filters. ADMIN sees all jobs; non-ADMIN sees own jobs only.
      Results are ordered by createdAt descending.
      """
      conditions = []
      params = []
      idx = 1

      if not is_admin and user_id:
          conditions.append(f'"userId" = ${idx}')
          params.append(user_id)
          idx += 1

      if site_id:
          conditions.append(f'"siteId" = ${idx}')
          params.append(site_id)
          idx += 1

      if trigger_id:
          conditions.append(f'"triggerId" = ${idx}')
          params.append(trigger_id)
          idx += 1

      where = " AND ".join(conditions)
      if where:
          where = "WHERE " + where

      query = f'SELECT * FROM background_jobs {where} ORDER BY "createdAt" DESC'

      async with pool.acquire() as conn:
          rows = await conn.fetch(query, *params)
      return [_row_to_dict(row) for row in rows]
  ```

  ### update_job
  ```python
  async def update_job(
      pool: asyncpg.Pool,
      job_id: str,
      **kwargs: Any,
  ) -> None:
      """
      Update one or more fields on a job record.
      Accepts any combination of: status, progress, started_at, finished_at,
      result, error, cancel_requested.
      """
      # Map Python snake_case kwargs to DB camelCase columns
      column_map = {
          "status": "status",
          "progress": "progress",
          "started_at": '"startedAt"',
          "finished_at": '"finishedAt"',
          "result": "result",
          "error": "error",
          "cancel_requested": '"cancelRequested"',
      }

      sets = []
      params = []
      idx = 1
      for key, value in kwargs.items():
          col = column_map.get(key)
          if col is None:
              raise ValueError(f"Unknown job field: {key}")
          # JSON fields need explicit cast
          if key == "result":
              sets.append(f"{col} = ${idx}::jsonb")
              params.append(json.dumps(value) if value is not None else None)
          else:
              sets.append(f"{col} = ${idx}")
              params.append(value)
          idx += 1

      if not sets:
          return

      params.append(job_id)
      query = f'UPDATE background_jobs SET {", ".join(sets)} WHERE id = ${idx}'

      async with pool.acquire() as conn:
          await conn.execute(query, *params)
  ```

  ### append_log
  ```python
  async def append_log(pool: asyncpg.Pool, job_id: str, message: str) -> None:
      """Append a timestamped log entry to the job's log array."""
      ts = datetime.now(timezone.utc).isoformat()
      entry = json.dumps(f"[{ts}] {message}")
      async with pool.acquire() as conn:
          await conn.execute(
              f'UPDATE background_jobs SET log = log || ${1}::jsonb WHERE id = ${2}',
              f'[{entry}]', job_id,
          )
  ```

  ### request_cancel
  ```python
  async def request_cancel(pool: asyncpg.Pool, job_id: str) -> bool:
      """
      Request cancellation of a job. Sets the DB flag and the in-memory event.
      Returns True if the job was found and in a cancellable state.
      """
      async with pool.acquire() as conn:
          result = await conn.execute(
              """
              UPDATE background_jobs
              SET "cancelRequested" = true
              WHERE id = $1 AND status IN ('queued', 'running')
              """,
              job_id,
          )

      if result == "UPDATE 0":
          return False

      event = _cancel_events.get(job_id)
      if event:
          event.set()
      return True
  ```

  ### is_cancelled
  ```python
  def is_cancelled(job_id: str) -> bool:
      """Check the in-memory cancel event (fast, no DB round-trip)."""
      event = _cancel_events.get(job_id)
      return event.is_set() if event else False
  ```

  ### prune_old_jobs
  ```python
  async def prune_old_jobs(pool: asyncpg.Pool, max_age_hours: int = 24) -> int:
      """
      Delete completed jobs older than max_age_hours.
      Also mark any 'running' or 'queued' jobs as 'failed' (stale from restart).
      Returns the number of rows affected.
      """
      cutoff = datetime.now(timezone.utc) - timedelta(hours=max_age_hours)

      async with pool.acquire() as conn:
          # Mark stale running/queued jobs as failed (from server restart)
          stale = await conn.execute(
              """
              UPDATE background_jobs
              SET status = 'failed', error = 'Server restarted before job completed'
              WHERE status IN ('queued', 'running')
              """,
          )
          logger.info("Marked stale jobs: %s", stale)

          # Delete old completed jobs
          deleted = await conn.execute(
              """
              DELETE FROM background_jobs
              WHERE "finishedAt" < $1
              AND status IN ('success', 'partial', 'failed', 'cancelled')
              """,
              cutoff,
          )
          logger.info("Pruned old jobs: %s", deleted)

      # Clean up any leftover cancel events
      stale_ids = [k for k, v in _cancel_events.items() if v.is_set()]
      for job_id in stale_ids:
          _cancel_events.pop(job_id, None)

      return 0  # simplified return
  ```

  ### cleanup_cancel_event
  ```python
  def cleanup_cancel_event(job_id: str) -> None:
      """Remove the in-memory cancel event for a finished job."""
      _cancel_events.pop(job_id, None)
  ```

  ### _row_to_dict (private helper)
  ```python
  def _row_to_dict(row: asyncpg.Record) -> dict:
      """Convert an asyncpg Record to a JSON-serialisable dict."""
      d = dict(row)
      # Rename camelCase DB columns to snake_case for API response
      return {
          "job_id": d["id"],
          "trigger_id": d["triggerId"],
          "job_type": d["jobType"],
          "instance_id": d["instanceId"],
          "instance_name": d["instanceName"],
          "site_id": d["siteId"],
          "site_name": d["siteName"],
          "user_id": d["userId"],
          "status": d["status"],
          "progress": d["progress"],
          "created_at": d["createdAt"].isoformat() if d["createdAt"] else None,
          "started_at": d["startedAt"].isoformat() if d.get("startedAt") else None,
          "finished_at": d["finishedAt"].isoformat() if d.get("finishedAt") else None,
          "result": d.get("result"),
          "log": d.get("log", []),
          "error": d.get("error"),
          "cancel_requested": d.get("cancelRequested", False),
      }
  ```

  ## Important implementation notes
  - All SQL queries use double-quoted column names for camelCase columns (Prisma convention).
  - The `result` field is stored as JSONB — use `json.dumps()` when writing and it will be
    auto-parsed by asyncpg when reading.
  - `_cancel_events` is module-level, shared across the process. No lock needed because
    asyncio is single-threaded and Event.set()/is_set() are thread-safe.
  - The `_row_to_dict` function normalises column names to snake_case for the API layer.

