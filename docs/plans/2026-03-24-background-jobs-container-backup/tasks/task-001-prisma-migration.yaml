  - "Migration SQL file exists at frontend/prisma/migrations/20260324_add_background_jobs/migration.sql"
  - "Migration SQL creates the background_jobs table with all columns matching the Prisma model"
  - "Migration SQL creates all four indexes"
  - "No foreign key constraints are defined (soft references only)"

