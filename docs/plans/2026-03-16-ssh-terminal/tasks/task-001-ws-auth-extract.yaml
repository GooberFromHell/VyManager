instructions: |
  Extract the `_authenticate_websocket()` function from monitoring.py into a shared module so both monitoring and the new terminal router can use it.

  ## 1. Create backend/ws_auth.py

  Move the `_authenticate_websocket` function (monitoring.py lines 585-652) into this new file. The function should be a standalone async function, not prefixed with underscore since it's now a public module.

  ```python
  """
  Shared WebSocket authentication utility.

  Validates session cookies for WebSocket connections that bypass the
  standard middleware chain (since FastAPI WebSocket endpoints don't
  go through Starlette middleware the same way HTTP does).
  """

  import asyncpg
  from datetime import datetime
  from typing import Optional
  from fastapi import WebSocket

  from session_cookie import verify_session_cookie


  async def authenticate_websocket(websocket: WebSocket) -> Optional[dict]:
      """
      Authenticate WebSocket connection using session cookie.
      Returns user_info dict with user_id, instance_id, email or None if auth fails.
      Sends error JSON and closes the connection on failure.
      """
      db_pool = getattr(websocket.app.state, "db_pool", None)
      if not db_pool:
          await websocket.send_json({"type": "error", "data": "Database not available"})
          await websocket.close()
          return None

      cookies = websocket.cookies
      session_token = cookies.get("better-auth.session_token") or cookies.get(
          "__Secure-better-auth.session_token"
      )

      if not session_token:
          await websocket.send_json({"type": "error", "data": "Not authenticated"})
          await websocket.close()
          return None

      token_id = verify_session_cookie(session_token)
      if not token_id:
          await websocket.send_json({"type": "error", "data": "Invalid session token"})
          await websocket.close()
          return None

      async with db_pool.acquire() as conn:
          session = await conn.fetchrow(
              """
              SELECT s.id, s."userId", s."expiresAt", u.email, u.name
              FROM sessions s
              JOIN users u ON s."userId" = u.id
              WHERE s.token = $1
              """,
              token_id,
          )

          if not session:
              await websocket.send_json({"type": "error", "data": "Session not found"})
              await websocket.close()
              return None

          if session["expiresAt"] < datetime.utcnow():
              await websocket.send_json({"type": "error", "data": "Session expired"})
              await websocket.close()
              return None

          active = await conn.fetchrow(
              """
              SELECT "instanceId" FROM active_sessions WHERE "userId" = $1
              """,
              session["userId"],
          )

          if not active:
              await websocket.send_json({
                  "type": "error",
                  "data": "No active instance. Connect to an instance first.",
              })
              await websocket.close()
              return None

          return {
              "user_id": session["userId"],
              "instance_id": active["instanceId"],
              "email": session["email"],
          }
  ```

