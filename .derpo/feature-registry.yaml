# VyManager Feature Registry
# Maps every implemented VyOS feature to its files across architecture layers.
# Used by DERPO to skip redundant discovery and provide precise context to agents.
#
# Convention: feature keys use snake_case (matching backend), file paths use kebab-case (matching frontend)

