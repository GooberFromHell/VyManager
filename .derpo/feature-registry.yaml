# === System Routers (non-feature) ===

system_routers:
  config:
    router: backend/routers/config/config.py
    purpose: "Config cache management, refresh endpoint"
  monitoring:
    router: backend/routers/monitoring/monitoring.py
    purpose: "SSE dashboard, WebSocket monitoring, SSH bridge"
  session:
    router: backend/routers/session/session.py
    purpose: "VyOS instance connection management, auto-provisioning"
  terminal:
    router: backend/routers/terminal/terminal.py
    purpose: "WebSocket SSH terminal"

# === Infrastructure Modules (non-feature, non-router) ===

infrastructure:
  provisioning:
    module: backend/provisioning.py
    purpose: "SSH-based auto-provisioning of VyOS API keys and SSH keys during instance creation"
    integrates_with: backend/routers/session/session.py
    depends_on:
      - backend/ssh_key_manager.py  # Ed25519 keypair generation + encryption
    frontend_integration:
      - frontend/src/lib/api/session.ts  # ProvisioningResult type, provisionInstance method
      - frontend/src/components/sites/CreateInstanceModal.tsx  # Auto-provisioning UI section

# === Registration Files ===
# These shared files must be updated when adding any new feature:

registration:
  mapper_registry: backend/vyos_mappers/__init__.py
  builder_exports: backend/vyos_builders/__init__.py
  router_inclusion: backend/app.py
  rbac_backend: backend/rbac_permissions.py
  rbac_frontend: frontend/src/lib/api/user-management.ts
  services_layout: frontend/src/app/(default)/(app)/system/services/layout.tsx
