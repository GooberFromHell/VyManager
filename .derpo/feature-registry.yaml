    router: backend/routers/interfaces/interfaces.py
    types: frontend/src/lib/api/types/ethernet.ts
    service: frontend/src/lib/api/interfaces.ts
    page: frontend/src/app/(default)/(app)/network/interfaces/page.tsx
    components: frontend/src/components/network/
    feature_group: INTERFACES

